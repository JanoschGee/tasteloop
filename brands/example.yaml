# Example brand configuration. Copy to ~/.config/tasteloop/brands/<your-brand>.yaml and adjust.
# One file per brand. Code and UI never contain a brand name; everything brand-specific lives here.
# NEVER put tokens or API keys here. They go into ~/.config/tasteloop/.env (see docs/security.md).
# Every key is explained in docs/configuration.md.

brand:
  id: your-brand              # lowercase, digits, dashes; used for service names and state
  name: Your Brand            # shown in notes, prompts and the gallery

language: en                  # language of analyses, digests and briefs: en or de (the interface is English)

channels: [telegram]          # capture channels; currently Telegram

telegram:
  chat_id: -1000000000000     # your group's ID (find it with: npm run ids)
  senders:                    # Telegram user ID -> name in notes. Same name = same person.
    "100000001": Alex
    "100000002": Sam
  known_senders_only: true    # ignore anyone not listed above
  attach_minutes: 15          # a voice note without reply is attached to the sender's last image within this window

vault:
  root: /Users/you/Obsidian/YourVault     # absolute path to the Obsidian vault (folder containing .obsidian)
  folder: "Brand/Tasteloop"               # where Tasteloop writes uploads, proposals, briefs, gallery, moodboard
  # sync_only: "Brand"                    # optional: the only folder that should exist on an always-on host

guide:
  file: "Brand/Brand Guide.md"            # your guide, relative to the vault root (start from templates/brand-guide.md)
  locked_key: locked                      # frontmatter key in the guide that lists locked headings
  locked: []                              # extra locked headings, in addition to the frontmatter list
  preamble_locked: true                   # title and intro are locked
  learning:                               # changes only ever land in these sections
    - "2. Expression (learns)"
  locked_tokens:                          # lines containing these never change, even inside the learning part
    - "`color.base`"
    - "`color.ink`"
  changelog_section: "4. Changelog"       # every applied change adds a row here
  version_key: version                    # frontmatter key incremented on every change
  date_key: updated                       # frontmatter key set to today on every change
  analysis_context: []                    # sections the image analysis reads (empty = whole guide)
  brief_blocks: "2.5 Prompt building blocks"
  brief_appendix:
    - "2.6 Review checklist"

approvers:                    # who may approve proposals (property approved_by); trust-based, see docs
  - Alex
  - Sam

models:
  analysis: claude-sonnet-5-5
  digest: claude-sonnet-5-5
  brief: claude-sonnet-5-5

transcription:
  local:
    enabled: true
    binary: whisper-cli
    model: ~/.local/share/whisper/ggml-large-v3-turbo-q5_0.bin
    ffmpeg: ffmpeg
    language: en              # spoken language of voice notes
    timeout_seconds: 180
  api:
    enabled: false            # true + a key in .env to fall back to ElevenLabs or OpenAI
    provider: elevenlabs

analyze_keep: false           # also analyse "Just keep" uploads (costs a little)

web:
  url: https://tasteloop.example.com      # optional, only used for links in chat messages
